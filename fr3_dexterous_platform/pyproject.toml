[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-dexterous-platform"
version = "0.1.0"
description = "Independent FR3 + LinkerHand + RealSense teleoperation, data collection, conversion, and deployment platform."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ros = ["setuptools"]
hdf5 = ["h5py"]
dev = []

[project.scripts]
fr3dex = "fr3_dexterous_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
